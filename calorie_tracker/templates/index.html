<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calorie Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen p-6"></body>

    <div class="w-full max-w-xl bg-white p-6 rounded shadow">
        <h1 class="text-2xl font-bold mb-4">Calorie Tracker</h1>

    
        <div class="mb-6">
            <span class="font-semibold">Total Calories Today: </span>
            <span>{{ total_calories }}</span>
        </div>

      
        <form method="POST" class="mb-6">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Food name" class="border p-2 rounded w-2/3" required>
            <input type="number" name="calories" placeholder="Calories" class="border p-2 rounded w-1/6" required>
            <button type="submit" class="bg-green-800 text-white p-2 rounded">Add</button>
        </form>

   
        <table class="w-full border-collapse">
            <thead>
                <tr>
                    <th class="border p-2 text-left">Food</th>
                    <th class="border p-2">Calories</th>
                    <th class="border p-2">Action</th>
                </tr>
            </thead>
            <tbody>
                {% for entry in entries %}
                <tr>
                    <td class="border p-2">{{ entry.name }}</td>
                    <td class="border p-2 text-center">{{ entry.calories }}</td>
                    <td class="border p-2 text-center">
                        <a href="{% url 'remove_food' entry.id %}" class="text-red-500">Remove</a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td class="border p-2 text-center" colspan="3">No food added yet</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>

    
        <div class="mt-4">
            <a href="{% url 'reset_calories' %}" class="bg-red-500 text-white p-2 rounded">Delete  All</a>
        </div>
    </div>

</body>
</html>
